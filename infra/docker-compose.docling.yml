services:
  docling:
    image: ghcr.io/docling-project/docling-serve:latest
    container_name: openrag-docling
    ports:
      - "5001:5001"
    environment:
      - DOCLING_BIND_HOST=0.0.0.0
      - DOCLING_WORKERS=1
      - DOCLING_OCR_ENGINE=easyocr
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5001/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
